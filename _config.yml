# GitHub Pages (Jekyll) settings: publish only the site, not the tooling.
# .well-known holds security.txt; Jekyll skips dot-folders unless they are named here.
include:
  - .well-known
exclude:
  - CLAUDE.md
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - package.json
  - package-lock.json
  - playwright.config.js
  - tests
  - tools
  - node_modules
